name: Athenaeum regressietests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Controleer JavaScript en TypeScript
        run: |
          git ls-files -z '*.js' '*.mjs' | xargs -0 -n 1 node --check
          git ls-files -z '*.ts' | xargs -0 node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { stripTypeScriptTypes } from "node:module";
            for (const file of process.argv.slice(1)) stripTypeScriptTypes(readFileSync(file, "utf8"));
          '
      - name: Controleer catalogus en offlinebestanden
        run: |
          node scripts/build-catalog.mjs
          node scripts/build-offline.mjs
          git diff --exit-code
          node scripts/verify-release.mjs
      - name: Test scores, lesbestanden en synchronisatie
        run: node --test scripts/verify-stability.mjs
      - name: Installeer Chromium voor de browsertests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test de echte gebruikersstromen in Chromium
        run: |
          baseline="$(mktemp -d)"
          git archive 56ef684681a383ad5399e791a06f1c6a32f821a4 | tar -x -C "$baseline"
          ATHENAEUM_BASELINE="$baseline" node --test scripts/verify-browser.mjs

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: athenaeum_fixture
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test vijf gelijktijdige databasesessies en back-upherstel
        env:
          ATHENAEUM_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node --test scripts/verify-postgres.mjs

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: '3.3.0'
      - name: Start de tijdelijke Supabase-stack
        run: |
          stage="$(mktemp -d)"
          echo "ATHENAEUM_SUPABASE_STAGE=$stage" >> "$GITHUB_ENV"
          cd "$stage"
          supabase init
          sed -i '/^major_version = /s/.*/major_version = 17/' supabase/config.toml
          cat "$GITHUB_WORKSPACE/supabase/config.toml" >> supabase/config.toml
          mkdir -p supabase/migrations supabase/functions
          cp -R "$GITHUB_WORKSPACE/supabase/functions/athenaeum-webpush" +                "$GITHUB_WORKSPACE/supabase/functions/telegram-bot" supabase/functions/
          cat > supabase/migrations/20261120000000_fixture_extensions.sql <<'SQL'
          create extension if not exists supabase_vault with schema vault;
          create extension if not exists pg_cron;
          SQL
          for migration in 20261121174406_athenaeum_learning.sql +                           20261122084119_athenaeum_webpush.sql +                           20261122124421_custom_webpush_schedule.sql +                           20261123210000_uncap_learning_history.sql; do
            cp "$GITHUB_WORKSPACE/supabase/migrations/$migration" supabase/migrations/
          done
          supabase start +            -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor +            > "$stage/start.log" 2>&1 || { tail -25 "$stage/start.log"; exit 1; }
          supabase status -o json > "$stage/api.json"
      - name: Test echte sessies, synchronisatie en meldingsinstellingen
        run: |
          npm install --no-save --package-lock=false fake-indexeddb@6.2.5
          ATHENAEUM_SUPABASE_CONFIG="$ATHENAEUM_SUPABASE_STAGE/api.json" node --test scripts/verify-supabase.mjs
      - name: Ruim de tijdelijke stack op
        if: always()
        run: |
          if [ -n "$ATHENAEUM_SUPABASE_STAGE" ]; then
            cd "$ATHENAEUM_SUPABASE_STAGE"
            supabase stop --no-backup
          fi
