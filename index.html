<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f4">
  <meta name="description" content="Oefen geschiedenis, algemene kennis, Italiaans en Frans met korte lessen en gespreide herhaling.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Athenaeum">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Athenaeum</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./academy/style.css?v=13r4">
  <script defer src="./shared/store.js"></script>
  <script defer src="./shared/sync.js"></script>
  <script type="module" src="./academy/app.js?v=13r5"></script>
</head>
<body>
  <a class="skip" href="#main">Naar de inhoud</a>
  <aside class="rail">
    <a class="brand" href="#vandaag" aria-label="Athenaeum startscherm">
      <img src="./assets/logos/athenaeum.svg" width="41" height="41" alt="">
      <span>Athenaeum</span>
    </a>
    <nav id="desktop-nav" class="nav" aria-label="Hoofdnavigatie"></nav>
    <nav id="desktop-secondary" class="nav rail-bottom" aria-label="Onderzoek en voortgang"></nav>
    <p class="rail-connection"><span id="rail-status" class="dot"></span><span id="rail-label">Verbinden…</span></p>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <a class="brand compact" href="#vandaag" aria-label="Athenaeum startscherm">
        <img src="./assets/logos/athenaeum.svg" width="33" height="33" alt="">
        <span>Athenaeum</span>
      </a>
      <p class="location" id="location">Hodie · Vandaag</p>
      <div class="top-actions">
        <details class="app-menu">
          <summary class="button quiet" aria-label="Instrumenta · Apps">Apps</summary>
          <nav id="mobile-apps" aria-label="Apps"></nav>
        </details>
        <form id="command-form" class="command" aria-label="Sneloefening">
          <label for="command" class="sr-only">Commando</label>
          <input id="command" placeholder="/leer" autocomplete="off" spellcheck="false" maxlength="20">
          <button class="command-submit" type="submit" aria-label="Voer commando uit">↵</button>
        </form>
        <button id="account" class="button quiet top-account" type="button" data-action="account">Account</button>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1">
      <div id="page-content"><div class="loading" role="status">Athenaeum opent…</div></div>
    </main>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Hoofdnavigatie mobiel"></nav>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <noscript><p class="notice">Zet JavaScript aan om met Athenaeum te leren.</p></noscript>
</body>
</html>
