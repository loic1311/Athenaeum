<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paideia · Athenaeum</title>
</head>
<body>
  <p><a href="../../#paideia">Open Paideia</a></p>
  <script>
    const destination = new URL('../../', location.href);
    const source = new URL(location.href);
    const profile = source.searchParams.get('ath_profile') || source.searchParams.get('profile');
    if (profile) {
      destination.searchParams.set('profile', profile);
      destination.searchParams.set('resume', '1');
    }
    destination.hash = source.hash.startsWith('#paideia') || source.hash.startsWith('#les/') ? source.hash : '#paideia';
    location.replace(destination);
  </script>
</body>
</html>
