function reveal(){const g=$('#guideline');g.classList.remove('hidden');$('#revealBtn').textContent='Richtlijn zichtbaar'}function nextQ(){const q=session.questions[session.index];const score=+($('#selfScore')?.value||75);session.answers.push({q:q.id,score});if(session.index<session.questions.length-1){session.index++;session.selected=null;renderQuestion();return}finishSession()}
function finishSession(){const avg=Math.round(session.answers.reduce((a,b)=>a+b.score,0)/Math.max(1,session.answers.length));const kind=session.kind;state.history.push({id:S.uid(),date:iso(),kind,title:session.title,score:avg,ai_reviewed:session.answers.filter(x=>x.ai_feedback).length,updated_at:Date.now()});if(['daily','ancient'].includes(kind))state.mastery.ancient=Math.round((state.mastery.ancient*3+avg)/4);if(['daily','general_history'].includes(kind))state.mastery.general_history=Math.round((state.mastery.general_history*3+avg)/4);if(kind==='general_knowledge')state.mastery.general_knowledge=Math.round((state.mastery.general_knowledge*3+avg)/4);if(kind==='skill')state.mastery.skill=Math.round((state.mastery.skill*3+avg)/4);if(kind==='daily'){completeDaily();advanceTopics()}else if(kind==='ancient'){state.ancient_index=(state.ancient_index+1)%seed.ancient_topics.length}else if(kind==='general_history'){state.general_index=(state.general_index+1)%seed.general_history_topics.length}else if(kind==='general_knowledge'){state.gk_index=(state.gk_index+1)%seed.general_knowledge_topics.length}else if(kind==='skill'){state.skill_index=(state.skill_index+1)%seed.skill_topics.length}save();$('#sessionModal').classList.remove('open');toast(`Sessie afgerond: ${avg}%`);renderHome()}
function completeDaily(){const today=iso();if(state.last_completed===today)return;const diff=state.last_completed?dayDiff(state.last_completed,today):1;if(diff===1||!state.last_completed)state.streak+=1;state.last_completed=today;if(!state.completed_dates.includes(today))state.completed_dates.push(today);state.daily_count+=1}function advanceTopics(){state.ancient_index=(state.ancient_index+1)%seed.ancient_topics.length;if(state.daily_count%2===0)state.general_index=(state.general_index+1)%seed.general_history_topics.length;if(extraDue())state.gk_index=(state.gk_index+1)%seed.general_knowledge_topics.length}
function renderLearn(){$('#p-learn').innerHTML=`<div class="hero"><h2>Leren</h2><p>De kern wordt later opgebouwd uit je eigen gecontroleerde scans en boeken. Het meegeleverde modelpakket is alleen een offline demonstratielaag.</p></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>🏺 Oude geschiedenis</h3><p>Niet alleen gebeurtenissen: ook personen, plaatsen, instituties, begrippen, bronnen, historiografische problemen, structuren, evoluties, revoluties, conjuncturen, processen en netwerken.</p><button class="btn primary" data-session="ancient">Start 20 min</button></div><div class="card"><h3>🌍 Algemene geschiedenis</h3><p>Dagelijkse breedte: chronologie, vergelijkingen, staatsvorming, economie, sociale structuren en grotere transities.</p><button class="btn primary" data-session="general_history">Start 10 min</button></div></div>`;$$('[data-session]').forEach(b=>b.onclick=()=>startSession(b.dataset.session))}
function examQs(monthly=false){if(!historyReadyAll())return [];const base=[...questionsFor('ancient',6),...questionsFor('general_history',4)];return base.map((q,i)=>({...q,type:'open',prompt:monthly?`Mastery-vraag ${i+1}: ${q.prompt}`:`Examenvraag ${i+1}: ${q.prompt}`}))}function startExam(monthly=false){if(!historyReadyAll()){toast('Examens worden vrijgegeven zodra Oude én Algemene Geschiedenis brongebonden kennis-packs bevatten.');showPage('library');return}session={kind:monthly?'monthly_exam':'weekly_exam',title:monthly?'Maandelijkse mastery check':'Wekelijks examen',questions:examQs(monthly),index:0,answers:[],started_at:Date.now()};$('#sessionTitle').textContent=session.title;$('#sessionMeta').textContent='Universitaire stijl · cumulatief · open antwoorden';$('#sessionModal').classList.add('open');renderQuestion()}
const oldFinish=finishSession;
function finishExamIfNeeded(){if(!session.kind.endsWith('_exam'))return false;const avg=Math.round(session.answers.reduce((a,b)=>a+b.score,0)/Math.max(1,session.answers.length));const rec={date:iso(),score:avg,id:S.uid(),ai_reviewed:session.answers.filter(x=>x.ai_feedback).length};if(session.kind==='weekly_exam')state.weekly_scores.push(rec);else state.monthly_scores.push(rec);if(avg>=75)state.icecubes+=1;state.history.push({...rec,kind:session.kind,title:session.title});save();$('#sessionModal').classList.remove('open');toast(`Examen: ${avg}%${avg>=75?' · 🧊 +1':''}`);renderExam();return true}
function nextQ2(){const q=session.questions[session.index],answer=$('#openAnswer')?.value.trim()||'',score=session.aiCurrent?.score_percent??+($('#selfScore')?.value||75);session.answers.push({q:q.id,score,answer,ai_feedback:session.aiCurrent||null});if(session.index<session.questions.length-1){session.index++;renderQuestion();return}if(!finishExamIfNeeded())finishSession()}
function renderExam(){const w=state.weekly_scores.at(-1),m=state.monthly_scores.at(-1);$('#p-exam').innerHTML=`<div class="hero"><h2>Examens</h2><p>Geen losse quizjes alleen: wekelijkse en maandelijkse toetsen vragen synthese, volledige evoluties, periodisering en verbanden zoals aan de universiteit.</p></div><div class="grid two" style="margin-top:16px"><div class="card exam-card"><h3>Wekelijks examen</h3><p>±45 min. Cumulatief, met open vragen, verklaringen en vergelijkingen.</p><button class="btn primary" id="weeklyBtn">Start weekexamen</button><p class="tiny">Laatste: ${w?w.score+'%':'nog geen'}</p></div><div class="card exam-card"><h3>Maandelijkse mastery check</h3><p>Brede synthese over structuren, evoluties en chronologische samenhang.</p><button class="btn gold" id="monthlyBtn">Start mastery check</button><p class="tiny">Laatste: ${m?m.score+'%':'nog geen'}</p></div></div>`;$('#weeklyBtn').onclick=()=>startExam(false);$('#monthlyBtn').onclick=()=>startExam(true)}
function renderKnowledge(){const packs=S.getProfileData(PID,'knowledge_packs',[]);$('#p-knowledge').innerHTML=`<div class="hero"><h2>Kennisbank</h2><p>Terugvinden wat je ooit geleerd hebt. Zodra je eigen boeken zijn omgezet in kennis-packs verschijnt hier brongebonden kennis met exacte paginaverwijzingen.</p></div><div class="stat-grid"><div class="stat"><div class="k">Oude geschiedenis mastery</div><div class="v">${state.mastery.ancient}%</div></div><div class="stat"><div class="k">Algemene geschiedenis</div><div class="v">${state.mastery.general_history}%</div></div><div class="stat"><div class="k">Algemene kennis</div><div class="v">${state.mastery.general_knowledge}%</div></div><div class="stat"><div class="k">Skills</div><div class="v">${state.mastery.skill}%</div></div></div><div class="card" style="margin-top:16px"><h3>Kennis-packs</h3>${packs.length?packs.map(p=>`<div style="padding:10px 0;border-bottom:1px solid #e1d9ca"><strong>${esc(p.title)}</strong><div class="tiny">${esc(p.source?.title||'')} · ${p.lessons?.length||0} lessen</div></div>`).join(''):'<p class="muted">Nog geen brongebonden kennis-packs geïmporteerd. Geschiedenistraining en examens blijven daarom vergrendeld; modelvragen zijn alleen aanvulling voor algemene kennis/skills.</p>'}</div>`}
function renderLibrary(){const packs=S.getProfileData(PID,'knowledge_packs',[]);$('#p-library').innerHTML=`<div class="hero"><h2>Bronnen</h2><p>Paideia geeft voorrang aan jouw gecontroleerde werken. Nieuwe contentpacks mogen pas als hoofdanker gelden wanneer titel, auteur en paginaverwijzingen controleerbaar zijn.</p></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Prioriteit</h3><p>1. Jouw scans/boeken<br>2. universitaire compendia<br>3. wetenschappelijke monografieën/artikels<br>4. modelkennis als aanvulling</p></div><div class="card"><h3>Geïmporteerd</h3><p>${packs.length} kennis-pack(s)</p><a class="btn" href="../../index.html">Importeer via Athenaeum Bibliotheek</a></div></div>`}
async function renderTelegram(){const n=window.AthTelegram?.notify(PID)||{morning:'08:00',reminder:'18:00',timezone:'Europe/Brussels'};$('#p-telegram').innerHTML=`<div class="hero"><h2>Telegram</h2><p>Laat Athenaeum Bot je 's ochtends vertellen wat vandaag gepland staat, hoeveel dagen je streak telt en wanneer je volgende examen komt. Een tweede melding kan je later herinneren als de dagsessie nog openstaat.</p></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>🔔 Meldingsschema</h3><div class="field"><label>Ochtend</label><input id="tgMorning" type="time" value="${esc(n.morning||'08:00')}"></div><div class="field" style="margin-top:10px"><label>Reminder</label><input id="tgReminder" type="time" value="${esc(n.reminder||'18:00')}"></div><div class="field" style="margin-top:10px"><label>Tijdzone</label><input id="tgTimezone" value="${esc(n.timezone||'Europe/Brussels')}"></div><button class="btn" id="tgSave" style="margin-top:12px">Bewaar schema</button></div><div class="card"><div class="spread"><h3>🤖 Athenaeum Bot</h3><span class="chip" id="tgState">controleren…</span></div><p class="muted" id="tgInfo">Telegram gebruikt dezelfde veilige Supabase-login als synchronisatie. Je bot-token staat nooit in de website.</p><div class="row"><button class="btn primary" id="tgPair">Koppelen</button><button class="btn" id="tgTest">Testmelding</button><button class="btn" id="tgDisconnect">Ontkoppelen</button><button class="btn" id="tgDiagnose">Diagnose</button><a class="btn" href="../../docs/TELEGRAM_SETUP_V1_0_5.txt" target="_blank">Stappenplan</a></div></div></div>`;const refresh=async()=>{const chip=$('#tgState'),info=$('#tgInfo');if(!window.AthTelegram){chip.textContent='niet beschikbaar';return}const s=await AthTelegram.status(PID);chip.textContent=s.connected?'✅ gekoppeld':'niet gekoppeld';info.textContent=s.connected?`Athenaeum Bot is gekoppeld${s.bot_username?' met @'+s.bot_username:''}.`:(s.error||'Koppel eerst de bot.')};$('#tgSave').onclick=async()=>{const x={morning:$('#tgMorning').value,reminder:$('#tgReminder').value,timezone:$('#tgTimezone').value};AthTelegram.saveNotify(PID,x);try{await AthTelegram.updateSchedule(PID,x)}catch{}toast('Meldingsschema bewaard.')};$('#tgPair').onclick=async()=>{try{const r=await AthTelegram.pair(PID);$('#tgInfo').innerHTML=`Koppelcode <strong>${r.code}</strong> is 30 minuten geldig. ${r.link?`<a href="${r.link}" target="_blank">Open @${esc(r.bot_username)} in Telegram</a>`:'Stuur in Athenaeum Bot: /start '+r.code}`;toast('Koppelcode gemaakt.')}catch(e){toast(e.message)}};$('#tgTest').onclick=async()=>{try{await AthTelegram.test(PID);toast('Testmelding verstuurd.')}catch(e){toast(e.message)}};$('#tgDisconnect').onclick=async()=>{try{await AthTelegram.disconnect(PID);toast('Telegram ontkoppeld.');refresh()}catch(e){toast(e.message)}};$('#tgDiagnose').onclick=async()=>{const r=await AthTelegram.diagnose(PID);$('#tgInfo').innerHTML=(r.steps||[]).map(x=>'• '+esc(x)).join('<br>')};refresh()}
function showPage(n){['home','learn','exam','knowledge','library','telegram'].forEach(x=>$('#p-'+x).classList.toggle('hidden',x!==n));$$('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===n));const t={home:['Paideia','Snel, efficiënt en cumulatief leren'],learn:['Leren','Dagelijkse kennisblokken'],exam:['Examens','Wekelijks en maandelijks'],knowledge:['Kennisbank','Wat je duurzaam beheerst'],library:['Bronnen','Herkomst en kennis-packs'],telegram:['Telegram','Ochtendmeldingen, reminders en examenaftelling']}[n];$('#paTitle').textContent=t[0];$('#paSub').textContent=t[1];({home:renderHome,learn:renderLearn,exam:renderExam,knowledge:renderKnowledge,library:renderLibrary,telegram:renderTelegram}[n])();scrollTo({top:0,behavior:'smooth'})}
function back(){location.href='../../index.html?resume=1&profile='+encodeURIComponent(PID)+'&page=apps'}function updateMode(){$('#paMode').textContent=(matchMedia('(display-mode: standalone)').matches?'App':'Web')+' · '+(innerWidth<=900?'telefoon':'laptop')}
async function init(){if(!PID||!profile())return location.href='../../index.html';await loadSeed();loadState();checkStreak();window.AthSync?.startAuto(PID);showPage('home');$$('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('#backAth').onclick=back;$('#backAthTop').onclick=back;$('#mBack').onclick=back;$('#closeSession').onclick=()=>$('#sessionModal').classList.remove('open');$('#revealBtn').onclick=reveal;$('#nextBtn').onclick=nextQ2;$('#useFreeze').onclick=()=>{const n=state.pending_missed||1;if(state.icecubes>=n){state.icecubes-=n;state.last_completed=iso(new Date(Date.now()-86400000));state.pending_missed=0;save();$('#freezeModal').classList.remove('open');toast(`Streak bevroren met ${n} ijsblokje${n===1?'':'s'}.`);renderHome()}};$('#breakStreak').onclick=()=>{state.streak=0;state.last_completed='';save();$('#freezeModal').classList.remove('open');renderHome()};updateMode();addEventListener('resize',updateMode)}
init();
})();

</script></body></html>
