<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Athenaeum deployment check</title><style>body{font:16px system-ui;background:#f7f2e7;color:#173b3d;max-width:800px;margin:40px auto;padding:20px}.ok{color:#18734d}.bad{color:#a52b2b}.row{padding:10px 0;border-bottom:1px solid #ddd}</style></head><body><h1>Athenaeum deployment check</h1><p>Controle van de belangrijkste GitHub Pages-bestanden.</p><div id="out"></div><script>const tests=['./index.html','./manifest.webmanifest','./sw.js','./apps/paideia/index.html','./apps/scriptorium/index.html','./apps/scriptorium/v6.css','./apps/scriptorium/v7.js'];(async()=>{let h='';for(const u of tests){try{const r=await fetch(u,{cache:'no-store'});h+=`<div class="row ${r.ok?'ok':'bad'}">${r.ok?'✓':'✗'} ${u} — HTTP ${r.status}</div>`}catch(e){h+=`<div class="row bad">✗ ${u} — ${e.message}</div>`}}document.querySelector('#out').innerHTML=h})()</script><p>V1.0.3 extra: controleer ook <code>shared/telegram.js</code>, <code>supabase/setup.sql</code> en <code>docs/SYNCHRONISATIE_V1_0_3.txt</code>.</p></body></html>
